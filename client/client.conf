# motor_ai_client -- read once at startup from the path in
# MOTOR_AI_CLIENT_CONFIG, or /etc/motor-ai-client/client.conf.
#
# Every key is optional; the value shown is the built-in default, so deleting
# a line and deleting the file do the same thing. Unknown keys are logged and
# ignored. Restart the client to pick up a change.

# Rows per window. One SOME/IP call carries one whole window.
#
# At 32 bytes a row this is ~810KB per call, which is why sendBatch is
# declared SomeIpReliable in the .fdepl: it travels over TCP, where vsomeip
# leaves the message size unlimited unless a max-payload-size-reliable says
# otherwise. Nothing in either vsomeip.json does.
#
# The server's own server.conf has this key too and the two are meant to
# match. They do not have to -- the server accumulates rows across calls, so a
# smaller number here simply takes several calls to fill one window there --
# but matching them is what makes one call mean one inference.
#
# Worth knowing what a window this size costs. The producer publishes a
# 200-row block every ~10ms, so 26000 rows is ~1.3s of motor. The call that
# follows blocks for as long as the server takes to run the models, and
# nothing drains the shared-memory ring meanwhile; that ring is 16 blocks
# deep, so those blocks are lapped and lost. Windows are samples, not a
# continuous record -- motor_recorder is what writes the full history.
window_rows = 26000

# How long to wait for the reply, in milliseconds.
#
# Not a round-trip time. The server runs inference before replying, and an
# anomalous window runs three models in sequence, each bounded by
# result_timeout_ms on that side. This has to exceed three of those plus the
# transfer, or the reply arrives after the client has stopped waiting for it.
# With the shipped result_timeout_ms of 30000, three stages is 90s.
#
# CommonAPI's own default is 5s and is never used: the client always passes
# this value explicitly.
call_timeout_ms = 120000

# How long to sleep between shared-memory polls, in milliseconds.
#
# The producer publishes a block every ~10ms into a 16-slot ring, which is
# ~160ms of history. This has to stay well under that or blocks are lapped
# before they are read, and a window can then never be filled from
# consecutive blocks.
poll_interval_ms = 20
